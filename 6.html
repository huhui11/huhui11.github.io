<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网上书城用户注册</title>
    <style>
        
        .wrap{
            width: 570px;
            margin: 30px auto;
            border: 4px solid #ffffff; 
            background: linear-gradient(#f7f7f7,#c8c8c8); 
            padding: 12px;
        }
        
        .inner-box{
            border: 3px solid #ffffff; 
            padding: 0;
        }
      
        .top-title{
            background-color: #606060;
            color: #fff;
            text-align: center;
            font-size: 26px;
            letter-spacing: 11px; 
            padding: 12px 0;
        }
        
        .reg-title{
            padding: 10px 30px;
            font-size: 22px;
            background: linear-gradient(#efefef,#cccccc);
        }
        
        table{
            border-collapse: collapse;
            width: 100%;
        }
        td{
            padding: 9px;
            text-align: center;
        }
        
        input{
            width: 340px;
            height: 30px;
            border: 1px solid #707070;
        }
       
        button{
            width: 340px;
            height: 36px;
            background-color: #555555;
            color: #fff;
            border: none;
        }
        
        .icon{
            margin-right: 8px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    
    <div class="wrap">
        
        <div class="top-title">网上书城</div>
     
        <div class="inner-box">
            <div class="reg-title">➕ 注册新用户</div>
            <table>
                <tr>
                    <td>
                        <span class="icon">👤</span>
                        <input type="text" placeholder="用户名">
                    </td>
                </tr>
                <tr>
                    <td>
                        <span class="icon">🔒</span>
                        <input type="password" placeholder="密码">
                    </td>
                </tr>
                <tr>
                    <td>
                        <span class="icon">🔐</span>
                        <input type="password" placeholder="确认密码">
                    </td>
                </tr>
                <tr>
                    <td>
                        <span class="icon">✉️</span>
                        <input type="email" placeholder="电子邮件">
                    </td>
                </tr>
                <tr>
                    <td>
                        <span class="icon">📝</span>
                        <button>注册新用户</button>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
