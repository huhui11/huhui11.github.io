<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网上书城用户注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
        }
        
        .wrap{
            width: 570px;
            margin: 30px auto;
            border: 4px solid #ffffff;
            background: #e8e8e8;
            padding: 12px;
        }
        .inner-box{
            border: 3px solid #ffffff;
        }
        .top-title{
            background-color: #606060;
            color: #fff;
            text-align: center;
            font-size: 26px;
            letter-spacing: 11px;
            padding: 12px 0;
        }
  
        .reg-title{
            padding: 10px 30px;
            font-size: 22px;
            background: #dddddd;
        }
        table{
            border-collapse: collapse;
            width: 100%;
        }
        td{
            padding: 12px 9px;
            text-align: center;
        }
        input{
            width: 340px;
            height: 30px;
            border: 1px solid #707070;
            padding: 0 8px;
            font-size: 14px;
        }
        button{
            width: 340px;
            height: 36px;
            background-color: #555555;
            color: #fff;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top-title">网上书城</div>
        <div class="inner-box">
            <div class="reg-title">➕ 注册新用户</div>
            <table>
                <tr>
                    <td><input type="text" placeholder="请输入用户名"></td>
                </tr>
                <tr>
                    <td><input type="password" placeholder="请输入密码"></td>
                </tr>
                <tr>
                    <td><input type="password" placeholder="请确认密码"></td>
                </tr>
                <tr>
                    <td><input type="email" placeholder="请输入电子邮件"></td>
                </tr>
                <tr>
                    <td><button>注册新用户</button></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
