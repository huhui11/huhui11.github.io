<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>时空辉夜姬 · 动态背景</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0b0613;
    position: relative;
  }

  /* 动态星云背景 */
  .nebula {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 30%,
      rgba(191, 161, 217, 0.28) 0%,
      rgba(136, 96, 185, 0.22) 25%,
      rgba(99, 60, 150, 0.16) 45%,
      rgba(40, 25, 75, 0.1) 70%,
      #0b0613 100%);
    animation: float 30s linear infinite alternate;
  }

  /* 时空流光 */
  .stream {
    position: absolute;
    width: 140%;
    height: 140%;
    top: -20%;
    left: -20%;
    background: linear-gradient(135deg,
      transparent 30%,
      rgba(180, 150, 220, 0.09) 50%,
      transparent 70%);
    animation: flow 20s linear infinite;
  }

  /* 辉夜核心光环 */
  .aura {
    position: absolute;
    width: 520px;
    height: 520px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(210, 180, 240, 0.25) 0%,
      rgba(150, 110, 200, 0.18) 30%,
      transparent 70%);
    border-radius: 50%;
    animation: pulse 14s ease-in-out infinite alternate;
  }

  /* 星光粒子 */
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 40px 70px, #e4d5ff, transparent),
      radial-gradient(1px 1px at 50px 50px, #d4bcff, transparent),
      radial-gradient(2px 2px at 130px 80px, #fff, transparent),
      radial-gradient(1px 1px at 90px 10px, #f0e5ff, transparent);
    background-size: 200px 200px;
    animation: twinkle 4s ease-in-out infinite alternate;
    opacity: 0.75;
  }

  /* 时空扭曲光带 */
  .light {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,
      transparent,
      rgba(170, 130, 255, 0.05),
      transparent);
    animation: lightMove 25s linear infinite;
  }

  /* 动画合集 */
  @keyframes float {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.1) translate(-1.5%, -1.5%); }
  }

  @keyframes flow {
    0% { background-position: -100% 100%; }
    100% { background-position: 100% -100%; }
  }

  @keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.95; }
  }

  @keyframes twinkle {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  @keyframes lightMove {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
</style>
</head>

<body>
  <div class="nebula"></div>
  <div class="stream"></div>
  <div class="aura"></div>
  <div class="stars"></div>
  <div class="light"></div>
</body>
</html>
